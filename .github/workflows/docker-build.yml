name: Docker Build CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Docker
        uses: docker/setup-compose-action@v1.2.0
        
      - name: Docker Compose
        run: docker compose build
      

