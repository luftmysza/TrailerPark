services:
  db:
    image: postgres:16-bookworm
    container_name: trailerpark_db
    environment:
      POSTGRES_DB: appdatabase
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - trailerpark-vol:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdatabase"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: trailerpark_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "8080:8080"

volumes:
  trailerpark-vol:
